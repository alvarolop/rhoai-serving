# Granite 4.1 8B FP8 (RedHatAI) - Single GPU generative model, 9.6 GB of weights (fits an L4)
# Replaces Granite 4.0 H Tiny FP8.
# Usage: helm template granite chart/ -f chart/values.yaml -f chart/values-granite-4-1-8b-fp8.yaml
#
# Tool calling used to reference Granite 3.3 flags (--chat-template tool_chat_template_granite_3.3.jinja,
# hermes parser). That filename is not shipped in vLLM / RHOAI inference images, which causes
# startup failure. Use the model tokenizer template by default. To enable tools on a build that
# includes Granite 4 templates and parser, add extraArgs such as:
#   --enable-auto-tool-choice
#   --tool-call-parser granite4
#   --chat-template <path-or-bundled-name-from-your-vllm-version>

name: granite-4-1-8b-fp8
namespace:
  create: false
  name: models-as-a-service

model:
  uri: hf://RedHatAI/granite-4.1-8b-fp8
  name: granite-4-1-8b-fp8
  metadata:
    useCase: chat
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications
# # For Model-as-a-Service (MaaS) routing, uncomment and configure:
#   routerGatewayRefs:
#     - name: maas-default-gateway
#       namespace: openshift-ingress

mainContainer:
  extraArgs:
    # Bounded context so the KV cache fits next to the weights on a 23 GB L4 (untested: raise if it fits)
    - "--max-model-len"
    - "32768"
  resources:
    limits:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "1"
      memory: "8Gi"
      nvidia.com/gpu: "1"
