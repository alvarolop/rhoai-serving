{{- if eq .Values.serving.type "predictive" }}
{{- $connProto := include "rhoai-serving.modelConnectionProtocol" . | trim -}}
{{- $s3path := include "rhoai-serving.modelConnectionS3Path" . | trim -}}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  annotations:
    opendatahub.io/connections: {{ .Values.name }}
    {{- if and (eq $connProto "s3") $s3path }}
    opendatahub.io/connection-path: {{ $s3path | quote }}
    {{- end }}
    opendatahub.io/model-type: predictive
    openshift.io/display-name: {{ .Values.name }}
    security.opendatahub.io/enable-auth: '{{ .Values.auth.enabled }}'
    serving.kserve.io/deploymentMode: RawDeployment
    {{- if eq .Values.scaling.mode "keda" }}
    serving.kserve.io/autoscalerClass: external
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8001"
    {{- end }}
    opendatahub.io/hardware-profile-name: {{ .Values.serving.hardwareProfile.name | quote }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.serving.hardwareProfile.namespace | quote }}
  labels:
    opendatahub.io/dashboard: "true"
    networking.kserve.io/visibility: exposed
    {{- if .Values.kueue.localQueueName }}
    kueue.x-k8s.io/queue-name: {{ .Values.kueue.localQueueName | quote }}
    {{- end }}
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: RollingUpdate
    # imagePullSecrets:
    #   - name: {{ .Values.name }}
    minReplicas: {{ .Values.scaling.replicas }}
    maxReplicas: {{ .Values.scaling.replicas }}
    {{- if and (eq (include "rhoai-serving.hasNvidiaGpu" . | trim) "true") .Values.serving.gpuPodTolerations }}
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    {{- end }}
    model:
      modelFormat:
        name: {{ .Values.runtime.modelFormat.name }}
        version: "{{ .Values.runtime.modelFormat.version }}"
      runtime: {{ .Values.name }}
      {{- $uri := .Values.model.uri | default "" | toString | trim -}}
      {{- if ne $connProto "s3" }}
      storageUri: {{ required "model.uri is required for predictive models using uri or oci connections" $uri | quote }}
      {{- else if $uri }}
      storageUri: {{ $uri | quote }}
      {{- end }}
      resources:
        {{- include "rhoai-serving.kserveModelResources" . | nindent 8 }}
{{- end }}
