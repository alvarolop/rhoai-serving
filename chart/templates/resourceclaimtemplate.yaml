{{- if and (eq (include "rhoai-serving.useDra" . | trim) "true") (not .Values.dra.claimTemplate.existing) }}
{{- $dra := .Values.dra -}}
{{- $count := include "rhoai-serving.gpuCount" . | trim | atoi -}}
{{- $gpuAttr := `device.attributes["gpu.nvidia.com"]` -}}
{{- $tensor := 0 -}}
{{- if .Values.parallelism }}{{- $tensor = (.Values.parallelism.tensor | default 0 | int) -}}{{- end }}
{{- if and $dra.mig.enabled (gt $tensor 1) }}
{{- fail "dra.mig.enabled with parallelism.tensor > 1: a vLLM process only sees the FIRST MIG partition of its list, so tensor parallelism cannot span MIG slices. Use full GPUs (dra.mig.enabled=false)." }}
{{- end }}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ include "rhoai-serving.draClaimTemplateName" . }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
spec:
  spec:
    devices:
      requests:
        - name: {{ include "rhoai-serving.draClaimName" . }}
          {{- if $dra.mig.enabled }}
          firstAvailable:
            {{- /* Preferred MIG profile first, fallback profile second */}}
            {{- range $i, $c := list (dict "n" "preferred" "c" $dra.mig.preferred) (dict "n" "fallback" "c" $dra.mig.fallback) }}
            {{- if $c.c.profile }}
            - name: {{ $c.n }}
              deviceClassName: {{ $dra.mig.deviceClassName }}
              allocationMode: ExactCount
              count: {{ $c.c.count | default 1 }}
              selectors:
                - cel:
                    expression: {{ printf "%s.profile == %q" $gpuAttr $c.c.profile | quote }}
            {{- end }}
            {{- end }}
          {{- else }}
          exactly:
            deviceClassName: {{ $dra.deviceClassName }}
            allocationMode: ExactCount
            count: {{ $count }}
            {{- $sel := list }}
            {{- if $dra.productName }}{{- $sel = append $sel (printf "%s.productName == %q" $gpuAttr $dra.productName) }}{{- end }}
            {{- if $dra.minMemory }}{{- $sel = append $sel (printf `device.capacity["gpu.nvidia.com"].memory.compareTo(quantity(%q)) >= 0` $dra.minMemory) }}{{- end }}
            {{- range $dra.selectors }}{{- $sel = append $sel . }}{{- end }}
            {{- if $sel }}
            selectors:
              {{- range $sel }}
              - cel:
                  expression: {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
{{- end }}
