{{- if eq .Values.serving.type "generative" }}
{{- $connProto := include "rhoai-serving.modelConnectionProtocol" . | trim -}}
{{- $s3path := include "rhoai-serving.modelConnectionS3Path" . | trim -}}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  annotations:
    openshift.io/display-name: {{ .Values.name }}
    opendatahub.io/connections: {{ .Values.name }}
    {{- if and (eq $connProto "s3") $s3path }}
    opendatahub.io/connection-path: {{ $s3path | quote }}
    {{- end }}
    opendatahub.io/genai-use-case: {{ .Values.model.metadata.useCase | quote }}
    security.opendatahub.io/enable-auth: '{{ .Values.auth.enabled }}'
    opendatahub.io/model-type: {{ .Values.model.metadata.type | quote }}
    {{- if .Values.serving.hardwareProfile.name }}
    opendatahub.io/hardware-profile-name: {{ .Values.serving.hardwareProfile.name | quote }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.serving.hardwareProfile.namespace | quote }}
    {{- end }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    kueue.x-k8s.io/queue-name: "default"

spec:

  # Model specification
  model:
    {{- $uri := .Values.model.uri | default "" | toString | trim -}}
    {{- if ne $connProto "s3" }}
    uri: {{ required "model.uri is required for generative models using uri or oci connections" $uri | quote }}
    {{- else if $uri }}
    uri: {{ $uri | quote }}
    {{- end }}
    name: {{ .Values.model.name | required "model.name is required" | quote }}
    criticality: {{ .Values.model.criticality | default "Critical" }}

  router:
    {{- if .Values.serving.routerGatewayRefs }}
    gateway:
      refs:
        {{- toYaml .Values.serving.routerGatewayRefs | nindent 8 }}
    {{- else }}
    gateway: {}
    {{- end }}
    {{- $requestTimeout := .Values.serving.router.route.requestTimeout | default "" | toString | trim -}}
    {{- if $requestTimeout }}
    route:
      http:
        spec:
          rules:
            - timeouts:
                request: {{ $requestTimeout | quote }}
    {{- else }}
    route: {}
    {{- end }}
    {{- if .Values.serving.router.intelligentRouting.enabled }}
    scheduler: {}
    {{- end }}

  {{- if .Values.parallelism }}
  {{- with .Values.parallelism }}
  # Multi-node distributed workload parallelism
  parallelism:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}

  # Decode workload (main)
  replicas: {{ .Values.scaling.replicas }}
  template:
    containers:
      - name: main
        {{- if .Values.mainContainer.image }}
        image: {{ .Values.mainContainer.image | quote }}
        {{- end }}
        {{- with .Values.mainContainer.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mainContainer.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.mainContainer.extraArgs .Values.mainContainer.env (eq (include "rhoai-serving.useHfToken" . | trim) "true") }}
        env:
          {{- if eq (include "rhoai-serving.useHfToken" . | trim) "true" }}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
          {{- end }}
          {{- if or .Values.mainContainer.extraArgs .Values.chatTemplate.enabled }}
          # KServe wrapper script reads VLLM_ADDITIONAL_ARGS and passes to vLLM
          # (vLLM v0.20+ may warn about unknown env var, but KServe requires this)
          - name: VLLM_ADDITIONAL_ARGS
            {{- if and .Values.chatTemplate.enabled .Values.mainContainer.extraArgs }}
            value: --chat-template /etc/vllm/template.jinja {{ join " " .Values.mainContainer.extraArgs }}
            {{- else if .Values.chatTemplate.enabled }}
            value: --chat-template /etc/vllm/template.jinja
            {{- else }}
            value: {{ join " " .Values.mainContainer.extraArgs | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.mainContainer.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- with .Values.mainContainer.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mainContainer.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mainContainer.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- include "rhoai-serving.kserveModelResources" . | nindent 10 }}
        {{- if .Values.chatTemplate.enabled }}
        volumeMounts:
          - name: chat-template-volume
            mountPath: /etc/vllm
        {{- end }}
    {{- if .Values.chatTemplate.enabled }}
    volumes:
      - name: chat-template-volume
        configMap:
          name: {{ .Values.name }}-chat-template
    {{- end }}
{{- end }}
