{{- if eq .Values.serving.type "generative" }}
{{- $connProto := include "rhoai-serving.modelConnectionProtocol" . | trim -}}
{{- $s3path := include "rhoai-serving.modelConnectionS3Path" . | trim -}}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  annotations:
    openshift.io/display-name: {{ .Values.name }}
    opendatahub.io/connections: {{ .Values.name }}
    {{- if and (eq $connProto "s3") $s3path }}
    opendatahub.io/connection-path: {{ $s3path | quote }}
    {{- end }}
    opendatahub.io/genai-use-case: {{ .Values.dashboard.genaiUseCase | quote }}
    security.opendatahub.io/enable-auth: '{{ .Values.auth.enabled }}'
    opendatahub.io/model-type: {{ .Values.dashboard.modelType | quote }}
    {{- if .Values.serving.hardwareProfile.name }}
    opendatahub.io/hardware-profile-name: {{ .Values.serving.hardwareProfile.name | quote }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.serving.hardwareProfile.namespace | quote }}
    {{- end }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    {{- if .Values.kueue.localQueueName }}
    kueue.x-k8s.io/queue-name: {{ .Values.kueue.localQueueName | quote }}
    {{- end }}

spec:

  # Model specification
  model:
    {{- $uri := .Values.model.uri | default "" | toString | trim -}}
    {{- if ne $connProto "s3" }}
    uri: {{ required "model.uri is required for generative models using uri or oci connections" $uri | quote }}
    {{- else if $uri }}
    uri: {{ $uri | quote }}
    {{- end }}
    name: {{ .Values.model.name | required "model.name is required" | quote }}
    criticality: Critical

  router:
    {{- if .Values.routerGatewayRefs }}
    gateway:
      refs:
        {{- toYaml .Values.routerGatewayRefs | nindent 8 }}
    {{- else }}
    gateway: {}
    {{- end }}
    route: {}
    scheduler: {}

  # Multi-node workload with data parallelism
  # parallelism:
  #   tensor: 4
  #   data: 8
  #   dataLocal: 4

  # Decode workload (main)
  replicas: {{ .Values.replicas }}
  template:
    containers:
      - name: main
        {{- if .Values.mainContainer.image }}
        image: {{ .Values.mainContainer.image | quote }}
        {{- end }}
        {{- with .Values.mainContainer.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.mainContainer.command }}
        {{- /* When command is set (old-style vLLM), generate args directly */ -}}
        args:
          - --model
          - /mnt/models
          - --port
          - "8000"
          - --served-model-name
          - {{ .Values.name }}
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
          {{- range .Values.mainContainer.extraArgs }}
          - {{ . }}
          {{- end }}
        {{- end }}
        {{- if or (and (not .Values.mainContainer.command) .Values.mainContainer.extraArgs) .Values.mainContainer.env (eq (include "rhoai-serving.useHfToken" . | trim) "true") }}
        env:
          {{- if eq (include "rhoai-serving.useHfToken" . | trim) "true" }}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
          {{- end }}
          {{- if and (not .Values.mainContainer.command) .Values.mainContainer.extraArgs }}
          # KServe wrapper script reads VLLM_ADDITIONAL_ARGS and passes to vLLM
          # (vLLM v0.20+ may warn about unknown env var, but KServe requires this)
          - name: VLLM_ADDITIONAL_ARGS
            value: {{ join " " .Values.mainContainer.extraArgs | quote }}
          {{- end }}
          {{- with .Values.mainContainer.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        resources:
          {{- include "rhoai-serving.kserveModelResources" . | nindent 10 }}
    {{- if and (eq (include "rhoai-serving.hasNvidiaGpu" . | trim) "true") .Values.serving.gpuPodTolerations }}
    tolerations:
      # Match Kueue gpu-flavor (operator Exists) or unsuspend Pod updates can fail.
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    {{- end }}
{{- end }}
