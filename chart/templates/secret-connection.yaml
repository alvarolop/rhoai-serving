{{- $proto := include "rhoai-serving.modelConnectionProtocol" . | trim -}}
{{- $mc := .Values.model.connection | default dict -}}
{{- $oci := $mc.oci | default dict -}}
{{- $s3 := $mc.s3 | default dict -}}
{{- $ociDc := $oci.dockerconfigjson | default "" | toString | trim -}}
{{- if eq $proto "oci" }}
{{- $ociUri := .Values.model.uri | required "model.uri is required for oci connection secrets" | toString }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: oci
    opendatahub.io/connection-type-protocol: oci
    opendatahub.io/connection-type-ref: oci-v1
    openshift.io/description: {{ .Values.name | quote }}
    openshift.io/display-name: {{ .Values.name | quote }}
type: Opaque
data:
  {{- if $ociDc }}
  .dockerconfigjson: {{ (ternary ($ociDc | toString) ($ociDc | toJson) (kindIs "string" $ociDc)) | b64enc }}
  {{- end }}
  OCI_HOST: {{ $ociUri | b64enc }}
{{- else if eq $proto "s3" }}
{{- $ep := $s3.endpoint | required "model.connection.s3.endpoint is required for s3 connection secrets" | toString | trim -}}
{{- $bucket := $s3.bucket | required "model.connection.s3.bucket is required for s3 connection secrets" | toString | trim -}}
{{- $ak := $s3.accessKeyId | required "model.connection.s3.accessKeyId is required for s3 connection secrets" | toString | trim -}}
{{- $sk := $s3.secretAccessKey | required "model.connection.s3.secretAccessKey is required for s3 connection secrets" | toString | trim -}}
{{- $reg := $s3.region | default "" | toString | trim -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-protocol: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/description: {{ .Values.name | quote }}
    openshift.io/display-name: {{ .Values.name | quote }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ $ak | b64enc }}
  AWS_S3_BUCKET: {{ $bucket | b64enc }}
  AWS_S3_ENDPOINT: {{ $ep | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ $sk | b64enc }}
  {{- if $reg }}
  AWS_DEFAULT_REGION: {{ $reg | b64enc }}
  {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: uri
    opendatahub.io/connection-type-protocol: uri
    opendatahub.io/connection-type-ref: uri-v1
    openshift.io/description: {{ .Values.name | quote }}
    openshift.io/display-name: {{ .Values.name | quote }}
type: Opaque
data:
  URI: {{ .Values.model.uri | required "model.uri is required for uri connection secrets" | toString | b64enc }}
{{- end }}
