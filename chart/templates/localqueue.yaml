{{- if and .Values.kueue.createLocalQueue .Values.namespace.kueueManaged }}
---
# LocalQueue that the workload label kueue.x-k8s.io/queue-name points to. Without it Kueue keeps the Workload
# Inadmissible ("LocalQueue ... doesn't exist") and the pods stay SchedulingGated.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ include "rhoai-serving.kueueLocalQueue" . }}
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterQueue: {{ include "rhoai-serving.kueueClusterQueue" . }}
{{- end }}
