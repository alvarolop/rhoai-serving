{{- if and (eq .Values.serving.type "predictive") (eq .Values.scaling.mode "keda") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}-thanos-metrics-reader
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
    verbs:
      - get
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheuses/api
    resourceNames:
      - k8s
    verbs:
      - get
      - create
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}
