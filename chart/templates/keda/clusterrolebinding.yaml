{{- if and (eq .Values.serving.type "predictive") (eq .Values.scaling.mode "keda") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-thanos-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.name }}-thanos-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-keda-sa
    namespace: {{ include "rhoai-serving.namespaceName" . }}
{{- end }}
