{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled (eq .Values.guardrails.type "nemo") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-nemo-guardrails
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    app: {{ .Values.name }}-nemo-guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}-nemo-guardrails
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-nemo-guardrails
    spec:
      serviceAccountName: {{ .Values.name }}-nemo-guardrails
      containers:
        - name: nemo-guardrails
          {{- if .Values.guardrails.nemo.image }}
          image: {{ .Values.guardrails.nemo.image }}
          {{- else }}
          image: quay.io/rhoai/nemo-guardrails:latest
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - nemoguardrails
            - server
            - --config
            - /config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.guardrails.nemo.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-nemo-config
{{- end }}
