    #       bot proceed with request
    #     else
    #       bot inform verification failed

    # Example: Context-aware guardrails
    # define flow check context
    #   if $conversation_history.length > 10
    #     bot suggest starting new conversation

    # Example: Time-based restrictions
    # define flow check business hours
    #   $current_hour = execute get_current_hour
    #   if $current_hour < 9 or $current_hour > 17
    #     bot inform outside business hours
{{- end }}
