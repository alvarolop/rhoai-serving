{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled (eq .Values.guardrails.type "nemo") }}
{{- $modelUrl := .Values.guardrails.nemo.modelUrl | default "" | toString | trim -}}
{{- if not $modelUrl }}
  {{- $modelNs := include "rhoai-serving.namespaceName" . -}}
  {{- $modelName := .Values.name -}}
  {{- if and .Values.guardrails.nemo.useGatewayRefs .Values.routerGatewayRefs }}
    {{- $gateway := index .Values.routerGatewayRefs 0 -}}
    {{- $gwName := $gateway.name | required "routerGatewayRefs[0].name is required when guardrails.nemo.useGatewayRefs is true" -}}
    {{- $gwNs := $gateway.namespace | required "routerGatewayRefs[0].namespace is required when guardrails.nemo.useGatewayRefs is true" -}}
    {{- $gwSvc := printf "%s-%s" $gwName $gwName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local/%s/%s/v1" $gwSvc $gwNs $modelNs $modelName -}}
  {{- else }}
    {{- /* Default: use internal workload service (HTTPS) */ -}}
    {{- $workloadSvc := printf "%s-kserve-workload-svc" $modelName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local:8000" $workloadSvc $modelNs -}}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nemo-config
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    app: {{ .Values.name }}-nemo-guardrails
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        parameters:
          openai_api_base: {{ $modelUrl }}
          model_name: {{ .Values.model.name }}

    rails:
      input:
        flows:
          - check message length
      output:
        flows:
          - check message length

  rails.co: |
    define flow check message length
      if len($user_message) > 2000
        bot inform message too long
        stop

    define bot inform message too long
      "Your message is too long. Please keep messages under 2000 characters."
{{- end }}
