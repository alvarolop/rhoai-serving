{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled (eq .Values.guardrails.type "nemo") }}
{{- /* Auto-generate main model URL if not provided */ -}}
{{- $modelUrl := .Values.guardrails.nemo.modelUrl | default "" | toString | trim -}}
{{- if not $modelUrl }}
  {{- $modelNs := include "rhoai-serving.namespaceName" . -}}
  {{- $modelName := .Values.name -}}
  {{- if .Values.routerGatewayRefs }}
    {{- /* Use internal gateway if routerGatewayRefs is configured */ -}}
    {{- $gateway := index .Values.routerGatewayRefs 0 -}}
    {{- $gwName := $gateway.name | required "routerGatewayRefs[0].name is required" -}}
    {{- $gwNs := $gateway.namespace | required "routerGatewayRefs[0].namespace is required" -}}
    {{- $gwSvc := printf "%s-%s" $gwName $gwName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local/%s/%s/v1" $gwSvc $gwNs $modelNs $modelName -}}
  {{- else }}
    {{- /* Default: use internal workload service (HTTPS) */ -}}
    {{- $workloadSvc := printf "%s-kserve-workload-svc" $modelName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local:8000" $workloadSvc $modelNs -}}
  {{- end }}
{{- end }}
{{- /* Auto-generate guard LLM URL if enabled and not provided */ -}}
{{- $guardUrl := "" -}}
{{- $guardModelName := "" -}}
{{- if .Values.guardrails.nemo.guardLlm.enabled }}
  {{- $guardUrl = .Values.guardrails.nemo.guardLlm.url | default "" | toString | trim -}}
  {{- $guardModelName = .Values.guardrails.nemo.guardLlm.modelName | required "guardrails.nemo.guardLlm.modelName is required when guardLlm.enabled is true" -}}
  {{- if not $guardUrl }}
    {{- $guardName := .Values.guardrails.nemo.guardLlm.name | required "guardrails.nemo.guardLlm.name is required when guardLlm.url is empty" -}}
    {{- $guardNs := .Values.guardrails.nemo.guardLlm.namespace | required "guardrails.nemo.guardLlm.namespace is required when guardLlm.url is empty" -}}
    {{- if .Values.routerGatewayRefs }}
      {{- /* Use internal gateway if routerGatewayRefs is configured */ -}}
      {{- $gateway := index .Values.routerGatewayRefs 0 -}}
      {{- $gwName := $gateway.name -}}
      {{- $gwNs := $gateway.namespace -}}
      {{- $gwSvc := printf "%s-%s" $gwName $gwName -}}
      {{- $guardUrl = printf "https://%s.%s.svc.cluster.local/%s/%s/v1" $gwSvc $gwNs $guardNs $guardName -}}
    {{- else }}
      {{- /* Default: use internal workload service (HTTPS) */ -}}
      {{- $guardWorkloadSvc := printf "%s-kserve-workload-svc" $guardName -}}
      {{- $guardUrl = printf "https://%s.%s.svc.cluster.local:8000" $guardWorkloadSvc $guardNs -}}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nemo-config
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    app: {{ .Values.name }}-nemo-guardrails
data:
  config.yaml: |
{{ tpl (.Files.Get "nemo-configs/config.yaml.tpl") (merge (dict "modelUrl" $modelUrl "guardUrl" $guardUrl "guardModelName" $guardModelName) .) | nindent 4 }}

  rails.co: |
{{ .Files.Get "nemo-configs/rails.co" | nindent 4 }}

  actions.py: |
{{ .Files.Get "nemo-configs/actions.py" | nindent 4 }}

  prompts.yaml: |
{{ .Files.Get "nemo-configs/prompts.yaml" | nindent 4 }}

  flows_advanced.co: |
{{ .Files.Get "nemo-configs/flows_advanced.co" | nindent 4 }}
{{- end }}
