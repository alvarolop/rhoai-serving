{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled }}
{{- /* Auto-generate main model URL if not provided */ -}}
{{- $modelUrl := .Values.guardrails.modelUrl | default "" | toString | trim -}}
{{- if not $modelUrl }}
  {{- $modelNs := include "rhoai-serving.namespaceName" . -}}
  {{- $modelName := .Values.name -}}
  {{- if .Values.serving.routerGatewayRefs }}
    {{- /* Use internal gateway if routerGatewayRefs is configured */ -}}
    {{- $gateway := index .Values.serving.routerGatewayRefs 0 -}}
    {{- $gwName := $gateway.name | required "routerGatewayRefs[0].name is required" -}}
    {{- $gwNs := $gateway.namespace | required "routerGatewayRefs[0].namespace is required" -}}
    {{- $gwSvc := printf "%s-%s" $gwName $gwName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local/%s/%s/v1" $gwSvc $gwNs $modelNs $modelName -}}
  {{- else }}
    {{- /* Default: use internal workload service (HTTPS) */ -}}
    {{- $workloadSvc := printf "%s-kserve-workload-svc" $modelName -}}
    {{- $modelUrl = printf "https://%s.%s.svc.cluster.local:8000" $workloadSvc $modelNs -}}
  {{- end }}
{{- end }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ .Values.name }}-nemo-guardrails
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    app: {{ .Values.name }}-nemo-guardrails
  annotations:
    security.opendatahub.io/enable-auth: 'true'
spec:
  nemoConfigs:
    - name: nemo-config
      configMaps:
        - {{ .Values.name }}-nemo-config
  env:
    - name: "MAIN_MODEL_BASE_URL"
      value: "{{ $modelUrl }}"
    - name: "OPENAI_API_KEY"
      valueFrom:
        secretKeyRef:
          name: {{ .Values.name }}-sa-token
          key: "token"
{{- if .Values.guardrails.guardLlm.enabled }}
    # Guard model authentication token for self-check flows
    - name: "GUARD_MODEL_API_KEY"
      valueFrom:
        secretKeyRef:
          name: {{ .Values.name }}-guard-token
          key: "token"
{{- end }}
    # Use OpenShift service CA bundle for internal gateway HTTPS
    - name: "SSL_CERT_FILE"
      value: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
{{- end }}
