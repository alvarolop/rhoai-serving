{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled (eq .Values.guardrails.type "nemo") }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ .Values.name }}-nemo-guardrails
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    app: {{ .Values.name }}-nemo-guardrails
  annotations:
    security.opendatahub.io/enable-auth: 'true'
spec:
  nemoConfigs:
    - name: {{ .Values.name }}-nemo-config
      configMaps:
        - {{ .Values.name }}-nemo-config
  {{- if .Values.guardrails.nemo.modelToken }}
  env:
    - name: "OPENAI_API_KEY"
      valueFrom:
        secretKeyRef:
          name: {{ .Values.name }}-nemo-api-token
          key: "token"
  {{- end }}
{{- end }}
