{{- if and (eq .Values.serving.type "generative") .Values.guardrails.enabled .Values.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.name }}-sa-token"
  namespace: {{ include "rhoai-serving.namespaceName" . }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    kubernetes.io/service-account.name: "{{ .Values.name }}-sa"
    openshift.io/display-name: {{ .Values.name }}-user
type: kubernetes.io/service-account-token
{{- end }}
