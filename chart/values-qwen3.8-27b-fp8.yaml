# Qwen3.8-27B FP8 (RedHatAI) - Dense 27B, 30.9 GB of weights. Needs an H100-class GPU (80 GB).
# Replaces Qwen3.5-35B-A3B GPTQ-Int4, which used 4 GPUs.
# Usage: helm template qwen38-27b-fp8 chart/ -f chart/values.yaml -f chart/values-qwen3.8-27b-fp8.yaml

name: qwen38-27b-fp8
namespace:
  create: false
  name: models-as-a-service

model:
  uri: hf://RedHatAI/Qwen3.8-27B-FP8
  name: RedHatAI/Qwen3.8-27B-FP8
  metadata:
    useCase: chat
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

mainContainer:
  # extraArgs:
  #   - "--max-model-len"
  #   - "32768"
  resources:
    limits:
      cpu: "8"
      memory: "64Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: "1"

# GPU through DRA: shared ResourceClaimTemplate defined by the platform (rhoai-gitops, templates/06-dra), not created by this chart.
# Sizes: gpu-s-x1 = small (L4 demo; MIG 1g.12gb / 2g.24gb or any GPU >= 16Gi), gpu-m-x1 = L4-class 24 GB, gpu-l-x1 = 1x H100 (>= 80Gi).
# Ignored with dra.enabled=false (device plugin). Remove the line to let the chart create its own template.
dra:
  claimTemplate:
    existing: gpu-l-x1
