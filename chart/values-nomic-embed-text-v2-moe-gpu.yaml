# Nomic Embed v2 MoE — **GPU** multilingual embeddings (BEST Nomic version)
#
# ✅ Nomic v2-moe is superior to v1:
#   - Better performance: BEIR 52.86, MIRACL 65.80 (100+ languages)
#   - MoE architecture: 475M params total, 305M active (requires GPU for fused_topk ops)
#   - Matryoshka embeddings: Flexible dimensions (768 → 256)
#   - Larger training data: 1.6B+ high-quality pairs
#
# ⚠️ MoE requires GPU/Triton - CPU not supported (fused_topk ops)
#
# Supported by vLLM v0.13.0+ via NomicBertModelC architecture
# See: https://docs.vllm.ai/en/v0.13.0/models/supported_models/#embedding
#
# Model card: https://huggingface.co/nomic-ai/nomic-embed-text-v2-moe
#
# Usage:
#   helm template nomic-v2-gpu chart/ \
#     -f chart/values.yaml \
#     -f chart/values-nomic-embed-text-v2-moe-gpu.yaml | oc apply -f -

name: nomic-embed-text-v2-moe
namespace:
  name: model-nomic-embed-v2

dashboard:
  genaiUseCase: embedding
  modelType: generative

model:
  uri: "hf://nomic-ai/nomic-embed-text-v2-moe"
  name: "nomic-ai/nomic-embed-text-v2-moe"
  connection:
    protocol: uri

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

# GPU resources for MoE embedding inference
# Uses OpenShift AI default vLLM GPU image (no override)
resources:
  limits:
    cpu: "6"
    memory: 24Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 12Gi
    nvidia.com/gpu: "1"

extraArgs:
  - "--trust-remote-code"
  - "--max-model-len"
  - "512"  # Nomic v2-moe uses 512 max_position_embeddings
  - "--disable-uvicorn-access-log"  # Reduce log verbosity (KServe router already logs requests)

# Allow Transformers to resolve auto_map modules
extraEnv:
  - name: HF_HUB_OFFLINE
    value: "0"
  - name: TRANSFORMERS_OFFLINE
    value: "0"

trustyai:
  enabled: false
