# Default values for rhoai-serving
# This is a YAML-formatted file.
#
# Usage (recommended): from repo root,
#   ./deploy-mode.sh chart/values-<model>.yaml
#
# Two-layer approach:
#   1. values.yaml        — Shared defaults and schema reference (not model-specific; e.g. resources: {})
#   2. values-<model>.yaml — Model identity (name, namespace, URI, resources, hardwareProfile, …)
#
# Hugging Face embeddings (vLLM --task embedding, GPU): values-nomic-embed-text-v1.yaml, values-bge-m3.yaml
# Guardrails (LlamaGuard): values-llamaguard-7b.yaml (gated HF; hfToken required)
#
# Predictive (OpenVINO) models: use a values file that sets serving.type: predictive and the
# runtime block (see values-distilbert.yaml).

# -- Resource identity name for the model serving deployment
name: model-server

# @section -- Namespace Configuration

# -- Target namespace configuration for all chart resources
namespace:
  # -- Create the namespace if it doesn't exist
  create: true
  # -- Namespace name
  name: models-as-a-service
  # -- OpenShift console display name (defaults to "Model - <name>" if empty)
  displayName: ""
  # -- OpenShift console description (defaults to "Serving model <name>" if empty)
  description: ""
  # -- Enable Kueue management label for queue enforcement (Red Hat OpenShift AI workload scheduling)
  kueueManaged: true

# @section -- Monitoring Configuration

# -- OpenShift monitoring configuration for predictive models with KEDA autoscaling
monitoring:
  # -- Disable user workload monitoring (use cluster monitoring instead). When true, sets openshift.io/cluster-monitoring label on namespace for KEDA metrics access. Only applies to predictive models with scaling.mode: keda.
  userWorkloadDisabled: false

# @section -- Serving Configuration

# -- Model serving configuration. Determines whether to deploy generative (LLMInferenceService) or predictive (InferenceService) models.
serving:
  # -- Serving type: "generative" for vLLM-based LLMs, "predictive" for OpenVINO/ONNX runtimes
  type: generative
  # -- OpenShift AI HardwareProfile reference
  hardwareProfile:
    # -- HardwareProfile name (cpu-profile for CPU-only, gpu-profile for GPU models)
    name: gpu-profile
    # -- HardwareProfile namespace
    # @default -- redhat-ods-applications
    namespace: redhat-ods-applications
  # -- Gateway API refs for spec.router.gateway. Default empty for standard llm-d + Route. Set for MaaS deployments.
  # @default -- []
  routerGatewayRefs: []
  # -- Router configuration for intelligent routing and HTTPRoute settings
  router:
    # -- HTTPRoute configuration for request timeouts and URL rewriting
    route:
      # -- Request timeout for long-running inference (e.g., "300s", "5m"). Leave empty for default Gateway timeout.
      requestTimeout: ""
    # -- Scheduler configuration (llm-d EPP). Always enabled in RHOAI 3.4+ for intelligent routing.
    scheduler:
      # -- Custom EndpointPickerConfig for advanced scheduler tuning. Leave empty for defaults (prefix-cache-scorer, queue-scorer, kv-utilization-scorer with standard weights).
      # @default -- {} (uses default EPP configuration)
      endpointPickerConfig: {}
      # Example: Tune prefix cache and queue weights for better performance
      # endpointPickerConfig:
      #   apiVersion: inference.networking.x-k8s.io/v1alpha1
      #   kind: EndpointPickerConfig
      #   plugins:
      #     - type: prefix-cache-scorer
      #       parameters:
      #         blockSizeTokens: 5
      #         maxPrefixBlocksToMatch: 256
      #     - type: queue-scorer
      #     - type: kv-cache-utilization-scorer
      #     - type: max-score-picker
      #   schedulingProfiles:
      #     - name: default
      #       plugins:
      #         - pluginRef: prefix-cache-scorer
      #           weight: 60  # Increase for more cache affinity
      #         - pluginRef: queue-scorer
      #           weight: 30  # Queue depth impact
      #         - pluginRef: kv-cache-utilization-scorer
      #           weight: 10  # KV utilization impact
  # -- MaaS (Models-as-a-Service) catalog integration. Creates MaaSModelRef CR using namespace.displayName, namespace.description, and dashboard.genaiUseCase.
  maas:
    # -- Enable MaaSModelRef creation for MaaS catalog
    enabled: true

# @section -- Scaling Configuration

# -- Scaling configuration for model serving workloads
scaling:
  # -- Scaling mode: "fixed" (static replicas), "hpa" (predictive models CPU/memory HPA), "keda" (predictive models custom metrics), "wva" (generative models - not yet available)
  mode: fixed
  # -- Number of replicas when mode is "fixed"
  replicas: 1
  # -- HPA autoscaling configuration (only used when mode is "hpa" for predictive models). Uses standard Kubernetes HPA with CPU/memory metrics.
  hpa:
    # -- Minimum number of replicas for autoscaling
    minReplicas: 1
    # -- Maximum number of replicas for autoscaling
    maxReplicas: 5
    # -- Scaling metric type (cpu or memory)
    scaleMetric: cpu
    # -- Target value for the metric (e.g., 80 for 80% CPU utilization)
    scaleTarget: 80
  # -- KEDA autoscaling configuration (only used when mode is "keda" for predictive models). Requires KEDA operator installed.
  keda:
    # -- Minimum number of replicas for autoscaling
    minReplicas: 1
    # -- Maximum number of replicas for autoscaling
    maxReplicas: 5
    # -- Polling interval in seconds for checking metrics
    pollingInterval: 5
    # -- Prometheus trigger configuration
    prometheus:
      # -- Prometheus server address (default: Thanos Querier in openshift-monitoring)
      # @default -- https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
      serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
      # -- PromQL query for scaling metric. Default uses ovms_current_requests for OpenVINO models.
      # @default -- sum(ovms_current_requests{namespace="NAMESPACE", pod=~"NAME-predictor.*"})
      query: ""
      # -- Threshold value that triggers scaling (number of concurrent requests)
      threshold: 2
      # -- Authentication mode for Prometheus (bearer token from ServiceAccount)
      authModes: bearer

# @section -- Model Configuration

# -- Model source configuration (KServe/OpenShift AI storage URI). Supported schemes: hf://, s3://, pvc://, oci://
model:
  # -- Model URI (e.g., hf://RedHatAI/Qwen3-8B-FP8-dynamic, oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5)
  uri: ""
  # -- Model name for serving requests
  name: ""
  # -- Model criticality level for KServe scheduling and prioritization (Critical, High, Medium, Low)
  criticality: Critical
  # -- Maximum model sequence length (context window). Optional - only set when using --max-model-len vLLM arg or for MaaSModelRef annotation.
  maxModelLen: ""
  # -- Model metadata annotations for OpenShift AI dashboard and MaaS catalog
  metadata:
    # -- Use case type: "chat", "embedding", "moderation"
    useCase: chat
    # -- Model type: "generative", "predictive"
    type: generative
  # -- OCI registry connection settings (only used when uri starts with oci://)
  oci:
    # -- Docker config JSON for private registries (base64 encoded). Leave empty for public registries.
    dockerconfigjson: ""
  # -- S3-compatible storage configuration (only used when uri starts with s3://)
  s3:
    # -- S3 endpoint URL (e.g., http://minio.minio.svc.cluster.local:9000)
    endpoint: ""
    # -- S3 bucket name
    bucket: ""
    # -- S3 access key ID
    accessKeyId: ""
    # -- S3 secret access key
    secretAccessKey: ""
    # -- S3 region
    region: ""
    # -- Object prefix/path inside the bucket (opendatahub.io/connection-path annotation)
    path: ""
    # -- OpenShift Data Foundation ObjectBucketClaim name. When set, credentials are read from ODF-generated Secret/ConfigMap instead of manual fields above.
    objectBucketClaim: ""

# @section -- Authentication and Secrets

# -- Hugging Face token for gated/private models. Chart creates hf-secret when model.uri starts with hf:// and this is non-empty.
# @default -- "" (pass via --set-file hfToken=.hf_token)
hfToken: ""

# -- Authentication configuration via Red Hat Connectivity Link (Kuadrant/Authorino)
auth:
  # -- Enable authentication for the inference service
  enabled: true

# @section -- Chat Template Configuration

# -- Custom chat template for generative models (vLLM). Use when model lacks built-in template.
chatTemplate:
  # -- Enable custom chat template via ConfigMap
  enabled: false
  # -- Jinja2 template content. Mounted at /etc/vllm/template.jinja and passed to vLLM via --chat-template
  # @default -- "" (provide template in model-specific values file)
  template: ""

# @section -- TrustyAI Configuration

# -- TrustyAI monitoring for bias and data drift detection
trustyai:
  # -- Enable TrustyAI service deployment
  enabled: false

# @section -- Guardrails Configuration

# -- Guardrails for content moderation and safety
guardrails:
  # -- Enable NeMo Guardrails integration
  enabled: false

  # -- LLM model endpoint URL. Leave empty to auto-generate: If routerGatewayRefs exists, uses internal gateway (https://<gateway-svc>/<namespace>/<model>/v1). Otherwise, uses direct workload service (https://<model>-kserve-workload-svc:8000).
  modelUrl: ""

  # -- Guard LLM Configuration for self-check flows
  # Red Hat OpenShift AI supports using separate models for self-check guardrails (type: self_check_input, self_check_output)
  # This enables smaller, faster models as guardrail judges while reserving larger models for inference
  guardLlm:
    # -- Enable guard LLM for self-check flows
    enabled: false
    # -- Guard model endpoint URL (leave empty to auto-generate from name/namespace)
    url: ""
    # -- Guard model name (must match model.name in the guard model's deployment)
    modelName: ""
    # -- Guard model deployment name (used for URL generation if url is empty)
    name: ""
    # -- Guard model namespace (used for URL generation if url is empty)
    namespace: ""
    # -- Guard model ServiceAccount token (pass via --set guardrails.guardLlm.token=$(oc get secret <guard-sa-token> -n <namespace> -o jsonpath='{.data.token}' | base64 -d))
    token: ""

  # -- NeMo Guardrails config.yaml content. This controls which guardrails are active.
  # The model connection (openai_api_base, model_name) is auto-injected by the template.
  # Default configuration includes three core guardrails:
  #   1. Jailbreak detection (keyword-based)
  #   2. Malicious script blocking
  #   3. PII detection (Presidio)
  # Override in model-specific values files to customize entities, thresholds, or disable flows.
  # @default -- Jailbreak + script blocking + PII detection
  config: |
    # Presidio-based PII Detection
    # Detects sensitive data in user input and bot output
    # For full entity list: https://microsoft.github.io/presidio/supported_entities/
    sensitive_data_detection:
      input:
        score_threshold: 0.6  # Minimum confidence (0.0-1.0) to reduce false positives
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - US_SSN
      output:
        score_threshold: 0.6
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD

    # Active guardrails flows
    rails:
      input:
        flows:
          - check message length           # Block messages over 2000 chars
          - check jailbreak                # Detect jailbreak attempts (keyword patterns)
          - check malicious scripts        # Block requests for exploits/malware
          - mask sensitive data on input   # Presidio PII masking
      output:
        flows:
          - check script in output         # Prevent script tags in responses
          - mask sensitive data on output  # Presidio PII masking

# @section -- Parallelism Configuration

# -- Multi-node distributed workload parallelism for generative models (LLMInferenceService only). Enables tensor parallelism (TP), data parallelism (DP), and expert parallelism (EP) across multiple GPUs/nodes. Leave empty {} for single-replica workloads.
# @default -- {} (single-replica, no parallelism)
parallelism: {}
  # -- Tensor parallelism: number of GPUs to split model layers across (intra-node model sharding)
  # tensor: 4
  # -- Data parallelism: total number of replica groups for distributed serving (throughput scaling)
  # data: 8
  # -- Data-local parallelism: replicas within each node before scaling to additional nodes (GPUs per node)
  # dataLocal: 4
  # -- Expert parallelism: enable for Mixture-of-Experts (MoE) models (e.g., Mixtral, DeepSeek-R1)
  # expert: true
  # -- Data RPC port: port number for data parallelism communication between replicas
  # dataRPCPort: 29550

# @section -- Container Configuration

# -- Main container configuration for LLMInferenceService/InferenceService pods
mainContainer:
  # -- Container image (leave empty to use OpenShift AI default vLLM or OpenVINO image)
  image: ""
  # -- Container command override
  command: []
  # -- Container args override
  args: []
  # -- Extra runtime arguments. For generative models, joined into VLLM_ADDITIONAL_ARGS env var. For predictive models, appended as container args.
  extraArgs: []
  # -- Extra environment variables in standard Kubernetes env var format
  env: []
  # -- Container resource limits and requests. Override in values-<model>.yaml files per model requirements.
  # @default -- {} (set in model-specific values files)
  resources: {}
  # -- Startup probe configuration (useful for large models with slow load times >2min)
  startupProbe: {}
  # -- Liveness probe configuration
  livenessProbe: {}
  # -- Readiness probe configuration
  readinessProbe: {}

# @section -- Predictive Runtime Configuration

# -- Predictive runtime configuration (only used when serving.type is "predictive")
runtime:
  # -- ServingRuntime display name
  displayName: "OpenVINO Model Server"
  # -- Runtime container image
  image: quay.io/opendatahub/openvino_model_server:stable
  # -- Runtime version
  version: v2025.4
  # -- Model format specification
  modelFormat:
    # -- Model format name
    name: openvino_ir
    # -- Model format version
    version: opset13
