# Default values for rhoai-serving
# This is a YAML-formatted file.
#
# Usage (recommended): from repo root,
#   ./deploy-mode.sh chart/values-<model>.yaml
#
# Two-layer approach:
#   1. values.yaml        — Shared defaults and schema reference (not model-specific; e.g. resources: {})
#   2. values-<model>.yaml — Model identity (name, namespace, URI, resources, hardwareProfile, …)
#
# Hugging Face embeddings (vLLM --task embedding, GPU): values-nomic-embed-text-v1.yaml, values-bge-m3.yaml
# Guardrails (LlamaGuard): values-llamaguard-7b.yaml (gated HF; hfToken required)
#
# Predictive (OpenVINO) models: use a values file that sets serving.type: predictive and the
# runtime block (see values-distilbert.yaml).

# Resource identity
name: model-server

# Target namespace for all chart resources
namespace:
  # When false, the Namespace object is not created — use an existing namespace (.name must match).
  create: true
  name: model-serving
  # OpenShift console: Namespace display name (defaults to .name if empty)
  displayName: ""
  # OpenShift console: longer description (optional; annotation omitted when empty)
  description: ""
  # Kueue (Red Hat build): queue enforcement for serving workloads requires this label on the namespace
  # (see OpenShift AI docs — Managing workloads with Kueue). Set false only if you intentionally opt out.
  kueueManaged: true

# Kueue: LocalQueue name used as label kueue.x-k8s.io/queue-name on serving CRs (required by the
# KServe LLMInferenceService admission webhook when Kueue validates). Must match a LocalQueue in
# the model namespace (rhoai-gitops rhoai-environment-chart uses localQueueName: default).
kueue:
  localQueueName: default

# Serving configuration (expects Kueue: namespace.kueueManaged on created namespaces)
#   type: "generative" => Creates LLMInferenceService (vLLM-based generative models)
#         "predictive" => Creates ServingRuntime + InferenceService (OpenVINO, ONNX, etc.)
#   gpuPodTolerations: when true (default) and .Values.resources request nvidia.com/gpu (non-zero), emit
#     nvidia.com/gpu NoSchedule tolerations on generative / predictive pod templates. Kueue
#     ResourceFlavors (e.g. gpu-flavor) often define the same toleration; duplicates are harmless.
#     Set false after verifying flavor tolerations reach pods without this (docs/004-kueue-gpu-tolerations.md).
#   hardwareProfile: OpenShift AI HardwareProfile CR (rhoai-gitops: cpu-profile and gpu-profile in
#     redhat-ods-applications). CPU-only models: name cpu-profile (chart treats this as no GPU request
#     in rendered resources even if Helm merge left nvidia.com/gpu from another layer); GPU models: gpu-profile.
#     Set both explicitly in each values-<model>.yaml. InferenceService always annotates the profile;
#     LLMInferenceService annotates when name is non-empty.
serving:
  type: generative
  gpuPodTolerations: true
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

replicas: 1

# Model source (KServe / OpenShift AI storage URI on the serving CR — unchanged).
# Supported URI schemes:
#   HuggingFace: hf://RedHatAI/Qwen3-8B-FP8-dynamic
#   S3 bucket:   s3://<bucket-name>/<object-key>
#   PVC:         pvc://<claim-name>/<pvc-path>
#   OCI image:   oci://<registry>/<org>/<repo>:<tag>
#
# Dashboard connection Secret (metadata.name == .name, linked via opendatahub.io/connections on
# LLMInferenceService / InferenceService / ServingRuntime). Matches RHOAI connections API:
#   - uri → Opaque, data.URI (base64), opendatahub.io/connection-type-ref uri-v1.
#   - oci → Opaque, data.OCI_HOST = base64(model.uri), connection-type-ref oci-v1; optional data .dockerconfigjson.
#   - s3  → Opaque, data AWS_* keys (base64), label opendatahub.io/managed, connection-type-ref s3; use connection-path on the serving CR
#     via model.connection.s3.path when the model lives under a prefix in the bucket.
# Use opendatahub.io/connection-type-protocol (not the deprecated connection-type-ref).
model:
  uri: ""
  name: ""
  connection:
    # auto | uri | oci | s3 — auto picks oci when model.uri starts with oci:// (or legacy: oci dockerconfigjson+host both set).
    protocol: auto
    oci:
      # Optional: include data[".dockerconfigjson"] when non-empty (private OCI registry). Public ModelCars
      # omit this key; OCI_HOST always mirrors model.uri (same as dashboard “OCI” connections).
      dockerconfigjson: ""
      # Legacy only: with dockerconfigjson, both host and dockerconfigjson non-empty still forces oci in auto.
      host: ""
    s3:
      # Option 1: Manual S3 configuration (MinIO, AWS S3, etc.)
      # Required when protocol is s3 and objectBucketClaim is empty.
      endpoint: ""
      bucket: ""
      accessKeyId: ""
      secretAccessKey: ""
      region: ""
      # Object prefix inside the bucket (opendatahub.io/connection-path); no leading slash required.
      path: ""

      # Option 2: Use OpenShift Data Foundation ObjectBucketClaim
      # When set, the chart reads S3 credentials from the OBC-generated Secret/ConfigMap.
      # ODF automatically creates:
      #   - Secret: <obc-name> with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      #   - ConfigMap: <obc-name> with BUCKET_HOST, BUCKET_NAME, BUCKET_PORT, BUCKET_REGION
      # Example workflow:
      #   1. Create ObjectBucketClaim: oc apply -f obc.yaml (creates Secret + ConfigMap)
      #   2. Set objectBucketClaim: "my-model-bucket" (name of the OBC)
      #   3. Chart automatically reads credentials from the generated Secret/ConfigMap
      # Leave empty to use manual configuration above.
      objectBucketClaim: ""

# Hugging Face token for gated/private Hub weights. The chart creates hf-secret and mounts
# HF_TOKEN only when model.uri starts with hf:// and this value is non-empty (see templates).
# Pass at deploy time, e.g. ./deploy-mode.sh chart/values-….yaml --set-file hfToken=.hf_token
hfToken: ""

# Authentication via Red Hat Connectivity Link (Kuadrant/Authorino)
auth:
  enabled: true

# OpenShift AI dashboard annotations on LLMInferenceService (generative path only).
dashboard:
  genaiUseCase: chat
  modelType: generative

# TrustyAI monitoring for bias and data drift detection.
# Deploys a TrustyAIService CR (PVC-backed) and the required CA bundle
# ConfigMap in the model's namespace for KServe RawDeployment integration.
trustyai:
  enabled: false

# Container resources (limits/requests). Leave unset here; set resources in each values-<model>.yaml
# (Helm deep-merges; CPU/GPU and memory differ per model).
resources: {}

# Main container configuration (LLMInferenceService spec.template.containers[main]).
# When image is empty, OpenShift AI / KServe default worker image applies.
mainContainer:
  image: ""
  command: []
  args: []
  # Extra arguments for the model runtime.
  # - Generative (vLLM): joined into VLLM_ADDITIONAL_ARGS env var (required by KServe wrapper).
  # - Predictive (OpenVINO): appended as container args.
  # Example (generative with tool use):
  #   extraArgs:
  #     - "--enable-auto-tool-choice"
  #     - "--tool-call-parser"
  #     - "hermes"
  # Example (generative with tuning):
  #   extraArgs:
  #     - "--gpu-memory-utilization"
  #     - "0.95"
  #     - "--max-model-len"
  #     - "32768"
  #     - "--enable-prefix-caching"
  extraArgs: []
  # Extra environment variables for the main container.
  # Uses standard Kubernetes env var format.
  # Example:
  #   env:
  #     - name: VLLM_CONFIGURE_LOGGING
  #       value: "1"
  #     - name: HF_HUB_OFFLINE
  #       value: "0"
  env: []

# Optional Gateway API refs for spec.router.gateway (non-empty => gateway.refs). Default empty
# for normal llm-d + Route. MaaS overlay: chart/values-tinyllama-1b-maas.yaml (set refs to a real
# Gateway, e.g. from oc get gateway.networking.k8s.io -A — do not assume maas-default-gateway).
routerGatewayRefs: []



# Predictive runtime configuration (only used when serving.type is "predictive")
runtime:
  displayName: "OpenVINO Model Server"
  image: quay.io/opendatahub/openvino_model_server:stable
  version: v2025.4
  modelFormat:
    name: openvino_ir
    version: opset13
