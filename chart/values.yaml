# Default values for rhoai-serving
# This is a YAML-formatted file.
#
# Usage (recommended): from repo root,
#   ./deploy-mode.sh chart/values-<model>.yaml
#
# Two-layer approach:
#   1. values.yaml        — Shared defaults and schema reference (not model-specific; e.g. resources: {})
#   2. values-<model>.yaml — Model identity (name, namespace, URI, resources, hardwareProfile, …)
#
# Hugging Face embeddings (vLLM --task embedding, GPU): values-nomic-embed-text-v1.yaml, values-bge-m3.yaml
# Guardrails (LlamaGuard): values-llamaguard-7b.yaml (gated HF; hfToken required)
#
# Predictive (OpenVINO) models: use a values file that sets serving.type: predictive and the
# runtime block (see values-distilbert.yaml).

# -- Resource identity name for the model serving deployment
name: model-server

# @section -- Namespace Configuration

# -- Target namespace configuration for all chart resources
namespace:
  # -- Create the namespace if it doesn't exist
  create: true
  # -- Namespace name
  name: model-serving
  # -- OpenShift console display name (defaults to "Model - <name>" if empty)
  displayName: ""
  # -- OpenShift console description (defaults to "Serving model <name>" if empty)
  description: ""
  # -- Enable Kueue management label for queue enforcement (Red Hat OpenShift AI workload scheduling)
  kueueManaged: true

# @section -- Kueue Configuration

# -- Kueue LocalQueue configuration
kueue:
  # -- LocalQueue name used as label kueue.x-k8s.io/queue-name on serving CRs. Must match a LocalQueue in the model namespace.
  localQueueName: default

# @section -- Serving Configuration

# -- Model serving configuration. Determines whether to deploy generative (LLMInferenceService) or predictive (InferenceService) models.
serving:
  # -- Serving type: "generative" for vLLM-based LLMs, "predictive" for OpenVINO/ONNX runtimes
  type: generative
  # -- Enable GPU pod tolerations when resources request nvidia.com/gpu. Matches Kueue ResourceFlavor tolerations.
  gpuPodTolerations: true
  # -- OpenShift AI HardwareProfile reference
  hardwareProfile:
    # -- HardwareProfile name (cpu-profile for CPU-only, gpu-profile for GPU models)
    name: gpu-profile
    # -- HardwareProfile namespace
    # @default -- redhat-ods-applications
    namespace: redhat-ods-applications

# @section -- Scaling Configuration

# -- Scaling configuration for model serving workloads
scaling:
  # -- Scaling mode: "fixed" (static replicas), "hpa" (predictive models CPU/memory HPA), "keda" (predictive models custom metrics), "wva" (generative models - not yet available)
  mode: fixed
  # -- Number of replicas when mode is "fixed"
  replicas: 1
  # -- HPA autoscaling configuration (only used when mode is "hpa" for predictive models). Uses standard Kubernetes HPA with CPU/memory metrics.
  hpa:
    # -- Minimum number of replicas for autoscaling
    minReplicas: 1
    # -- Maximum number of replicas for autoscaling
    maxReplicas: 5
    # -- Scaling metric type (cpu or memory)
    scaleMetric: cpu
    # -- Target value for the metric (e.g., 80 for 80% CPU utilization)
    scaleTarget: 80
  # -- KEDA autoscaling configuration (only used when mode is "keda" for predictive models). Requires KEDA operator installed.
  keda:
    # -- Minimum number of replicas for autoscaling
    minReplicas: 1
    # -- Maximum number of replicas for autoscaling
    maxReplicas: 5
    # -- Polling interval in seconds for checking metrics
    pollingInterval: 5
    # -- Prometheus trigger configuration
    prometheus:
      # -- Prometheus server address (default: Thanos Querier in openshift-monitoring)
      # @default -- https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
      serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
      # -- PromQL query for scaling metric. Default uses ovms_current_requests for OpenVINO models.
      # @default -- sum(ovms_current_requests{namespace="NAMESPACE", pod=~"NAME-predictor.*"})
      query: ""
      # -- Threshold value that triggers scaling (number of concurrent requests)
      threshold: 2
      # -- Authentication mode for Prometheus (bearer token from ServiceAccount)
      authModes: bearer

# @section -- Model Configuration

# -- Model source configuration (KServe/OpenShift AI storage URI). Supported schemes: hf://, s3://, pvc://, oci://
model:
  # -- Model URI (e.g., hf://RedHatAI/Qwen3-8B-FP8-dynamic, oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5)
  uri: ""
  # -- Model name for serving requests
  name: ""
  # -- Dashboard connection Secret configuration
  connection:
    # -- Connection protocol: "auto", "uri", "oci", or "s3". Auto detects from model.uri prefix.
    protocol: auto
    # -- OCI registry connection settings
    oci:
      # -- Docker config JSON for private registries (base64 encoded). Leave empty for public registries.
      dockerconfigjson: ""
      # -- Legacy OCI host field (deprecated, use model.uri)
      host: ""
    # -- S3-compatible storage configuration
    s3:
      # -- S3 endpoint URL (e.g., http://minio.minio.svc.cluster.local:9000)
      endpoint: ""
      # -- S3 bucket name
      bucket: ""
      # -- S3 access key ID
      accessKeyId: ""
      # -- S3 secret access key
      secretAccessKey: ""
      # -- S3 region
      region: ""
      # -- Object prefix/path inside the bucket (opendatahub.io/connection-path annotation)
      path: ""
      # -- OpenShift Data Foundation ObjectBucketClaim name. When set, credentials are read from ODF-generated Secret/ConfigMap instead of manual fields above.
      objectBucketClaim: ""

# @section -- Authentication and Secrets

# -- Hugging Face token for gated/private models. Chart creates hf-secret when model.uri starts with hf:// and this is non-empty.
# @default -- "" (pass via --set-file hfToken=.hf_token)
hfToken: ""

# -- Authentication configuration via Red Hat Connectivity Link (Kuadrant/Authorino)
auth:
  # -- Enable authentication for the inference service
  enabled: true

# @section -- Dashboard Configuration

# -- OpenShift AI dashboard annotations (generative models only)
dashboard:
  # -- Gen AI use case type: "chat", "embedding", "moderation"
  genaiUseCase: chat
  # -- Model type annotation
  modelType: generative

# @section -- Chat Template Configuration

# -- Custom chat template for generative models (vLLM). Use when model lacks built-in template.
chatTemplate:
  # -- Enable custom chat template via ConfigMap
  enabled: false
  # -- Jinja2 template content. Mounted at /etc/vllm/template.jinja and passed to vLLM via --chat-template
  # @default -- "" (provide template in model-specific values file)
  template: ""

# @section -- TrustyAI Configuration

# -- TrustyAI monitoring for bias and data drift detection
trustyai:
  # -- Enable TrustyAI service deployment
  enabled: false

# @section -- Guardrails Configuration

# -- Guardrails for content moderation and safety
guardrails:
  # -- Enable guardrails integration
  enabled: false
  # -- Guardrails type: "nemo" (NVIDIA NeMo Guardrails)
  type: nemo
  # -- NeMo Guardrails configuration (only used when type is "nemo")
  nemo:
    # -- LLM model endpoint URL. Leave empty to auto-generate: If routerGatewayRefs exists, uses internal gateway (https://<gateway-svc>/<namespace>/<model>/v1). Otherwise, uses direct workload service (https://<model>-kserve-workload-svc:8000).
    modelUrl: ""

# @section -- Resources Configuration

# -- Container resource limits and requests. Override in values-<model>.yaml files per model requirements.
# @default -- {} (set in model-specific values files)
resources: {}

# @section -- Main Container Configuration

# -- Main container configuration for LLMInferenceService/InferenceService pods
mainContainer:
  # -- Container image (leave empty to use OpenShift AI default vLLM or OpenVINO image)
  image: ""
  # -- Container command override
  command: []
  # -- Container args override
  args: []
  # -- Extra runtime arguments. For generative models, joined into VLLM_ADDITIONAL_ARGS env var. For predictive models, appended as container args.
  extraArgs: []
  # -- Extra environment variables in standard Kubernetes env var format
  env: []
  # -- Startup probe configuration (useful for large models with slow load times >2min)
  startupProbe: {}
  # -- Liveness probe configuration
  livenessProbe: {}
  # -- Readiness probe configuration
  readinessProbe: {}

# @section -- Router Configuration

# -- Gateway API refs for spec.router.gateway. Default empty for standard llm-d + Route. Set for MaaS deployments.
# @default -- []
routerGatewayRefs: []

# @section -- Predictive Runtime Configuration

# -- Predictive runtime configuration (only used when serving.type is "predictive")
runtime:
  # -- ServingRuntime display name
  displayName: "OpenVINO Model Server"
  # -- Runtime container image
  image: quay.io/opendatahub/openvino_model_server:stable
  # -- Runtime version
  version: v2025.4
  # -- Model format specification
  modelFormat:
    # -- Model format name
    name: openvino_ir
    # -- Model format version
    version: opset13
