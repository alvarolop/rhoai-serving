# TinyLlama 1B - CPU-only generative model (no GPU required).
#
# Non–Model-as-a-Service: leaves spec.router.gateway empty so OpenShift AI wires llm-d and a
# normal Route. Uses a CPU-oriented vLLM image (mainContainer) instead of the default CUDA worker.
#
# Usage:
#   helm template tinyllama chart/ -f chart/values.yaml -f chart/values-tinyllama-1b-cpu.yaml

name: tinyllama-1b
namespace:
  name: model-tinyllama

model:
  uri: "oci://quay.io/rh-aiservices-bu/tinyllama:1.0"
  name: "tinyllama-1b"
  connection:
    protocol: oci

serving:
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications

mainContainer:
  image: quay.io/rh-aiservices-bu/vllm-cpu-openai-ubi9:0.3
  command:
    - python
    - -m
    - vllm.entrypoints.openai.api_server
  args:
    - --model
    - /mnt/models
    - --port
    - "8000"
    - --max-model-len
    - "2048"
    - --served-model-name
    - tinyllama-1b
    - --ssl-certfile
    - /var/run/kserve/tls/tls.crt
    - --ssl-keyfile
    - /var/run/kserve/tls/tls.key
    - --disable-uvicorn-access-log

resources:
  limits:
    cpu: "8"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 4Gi
