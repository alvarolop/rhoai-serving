# BGE-M3 — Hugging Face multilingual embedding model on **GPU** (default OpenShift AI vLLM worker).
# Model card: https://huggingface.co/BAAI/bge-m3
# vLLM pooling support: https://docs.vllm.ai/en/latest/models/pooling_models/embed/
#
# Embedding flags are passed via extraArgs -> VLLM_ADDITIONAL_ARGS (no mainContainer override).
# Tune resources if you OOM or want a different GPU slice.
#
# Usage:
#   helm template bge-m3 chart/ \
#     -f chart/values.yaml \
#     -f chart/values-bge-m3.yaml | oc apply -f -

name: bge-m3
namespace:
  create: false
  name: models-as-a-service

model:
  # Own ModelCar built with packaging-modelcar/Dockerfile.small (pytorch_model.bin, single layer)
  uri: oci://quay.io/alopezme/modelcar-bge-m3:latest
  # uri: hf://BAAI/bge-m3
  name: BAAI/bge-m3
  metadata:
    useCase: embedding
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

scaling:
  mode: fixed
  replicas: 1

mainContainer:
  extraArgs:
    - "--max-model-len"
    - "8192"

  resources:
    limits:
      cpu: "6"
      memory: "24Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "2"
      memory: "8Gi"
      nvidia.com/gpu: "1"

# GPU through DRA: shared ResourceClaimTemplate defined by the platform (rhoai-gitops, templates/06-dra), not created by this chart.
# Sizes: gpu-s-x1 = small (L4 demo; MIG 1g.12gb / 2g.24gb or any GPU >= 16Gi), gpu-m-x1 = L4-class 24 GB, gpu-l-x1 = 1x H100 (>= 80Gi).
# Ignored with dra.enabled=false (device plugin). Remove the line to let the chart create its own template.
dra:
  claimTemplate:
    existing: gpu-s-x1
