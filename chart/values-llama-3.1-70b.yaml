# Llama 3.1 70B - Multi-GPU generative model (4x GPU)
# Usage: helm template llama chart/ -f chart/values.yaml -f chart/values-llama-3.1-70b.yaml

name: llama-3-1-70b
namespace:
  create: false
  name: rhoai-maas

model:
  uri: hf://RedHatAI/Llama-3.1-70B-Instruct-FP8-dynamic
  name: llama-3-1-70b-instruct
  metadata:
    useCase: chat
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications
# # For Model-as-a-Service (MaaS) routing, uncomment and configure:
#   routerGatewayRefs:
#     - name: maas-default-gateway
#       namespace: openshift-ingress

# Tensor parallelism: split model across 4 GPUs on a single node
parallelism:
  tensor: 4

mainContainer:
  extraArgs:
    - "--disable-uvicorn-access-log"

  resources:
    limits:
      cpu: "8"
      memory: "128Gi"
      nvidia.com/gpu: "4"
    requests:
      cpu: "4"
      memory: "64Gi"
      nvidia.com/gpu: "4"

