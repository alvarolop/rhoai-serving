# DistilBERT - Predictive model with OpenVINO runtime (CPU-only, ModelCar from Quay)
# Usage: helm template distilbert chart/ -f chart/values.yaml -f chart/values-distilbert.yaml
#
# DistilBERT is a smaller, faster version of BERT for text classification and NLP tasks.
# Model source: https://huggingface.co/docs/transformers/model_doc/distilbert

name: distilbert
namespace:
  name: model-distilbert

monitoring:
  userWorkloadDisabled: true

serving:
  type: predictive
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications

# Scaling configuration - supports three modes for predictive models:
# 1. "fixed" - Static replica count
# 2. "hpa" - Kubernetes HPA based on CPU/memory metrics
# 3. "keda" - KEDA autoscaling based on custom Prometheus metrics (requires KEDA operator)
scaling:
  mode: keda

  # Fixed scaling (uncomment and set mode: fixed to use)
  # replicas: 1

  # HPA autoscaling configuration (only used when mode: hpa)
  # Uncomment and set mode: hpa to enable HPA autoscaling
  # hpa:
  #   minReplicas: 1
  #   maxReplicas: 3
  #   scaleMetric: cpu      # cpu or memory
  #   scaleTarget: 70       # Target value (e.g., 70 for 70% CPU utilization)

  # KEDA autoscaling (active by default)
  # Uses rate of successful requests over 1 minute
  keda:
    minReplicas: 1
    maxReplicas: 3
    pollingInterval: 5
    prometheus:
      query: 'sum(rate(ovms_requests_success{namespace="model-distilbert", method="ModelInfer"}[1m]))'
      threshold: 10

model:
  uri: oci://quay.io/redhattraining/models/distilbert:2.25
  name: distilbert
  connection:
    protocol: oci

resources:
  limits:
    cpu: "1000m"
    memory: 2Gi
    # Override merged base defaults so CPU predictive does not inherit nvidia.com/gpu: 1
    nvidia.com/gpu: null
  requests:
    cpu: "100m"
    memory: 512Mi
    nvidia.com/gpu: null

mainContainer:
  extraArgs:
    - --nireq=10
    - --plugin_config={"PERFORMANCE_HINT":"THROUGHPUT"}

runtime:
  displayName: "OpenVINO Model Server"
  image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9:v3.3
  version: v2025.4
  modelFormat:
    name: onnx
    version: "1"

trustyai:
  enabled: true

# For Model-as-a-Service (MaaS) routing, uncomment and configure:
# routerGatewayRefs:
#   - name: maas-default-gateway
#     namespace: openshift-ingress
