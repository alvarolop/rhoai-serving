# DistilBERT - Predictive model with OpenVINO runtime (CPU-only, ModelCar from Quay)
# Usage: helm template distilbert chart/ -f chart/values.yaml -f chart/values-distilbert.yaml
#
# DistilBERT is a smaller, faster version of BERT for text classification and NLP tasks.
# Model source: https://huggingface.co/docs/transformers/model_doc/distilbert

name: distilbert
namespace:
  name: model-distilbert

serving:
  type: predictive
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications

# Scaling configuration - supports three modes for predictive models:
# 1. "fixed" - Static replica count (default)
# 2. "hpa" - Kubernetes HPA based on CPU/memory metrics (native KServe support)
# 3. "keda" - KEDA autoscaling based on custom Prometheus metrics (requires KEDA operator)
scaling:
  mode: fixed
  replicas: 1

  # HPA autoscaling configuration (only used when mode: hpa)
  # KServe creates HPA automatically based on CPU/memory metrics
  # Uncomment and set mode: hpa to enable HPA autoscaling
  # hpa:
  #   minReplicas: 1
  #   maxReplicas: 5
  #   scaleMetric: cpu      # cpu or memory
  #   scaleTarget: 80       # Target value (e.g., 80 for 80% CPU utilization)

  # KEDA autoscaling configuration (only used when mode: keda)
  # Creates ScaledObject with custom Prometheus queries
  # Uncomment and set mode: keda to enable KEDA autoscaling
  # keda:
  #   minReplicas: 1
  #   maxReplicas: 5
  #   pollingInterval: 5
  #   prometheus:
  #     serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
  #     threshold: "2"
  #     authModes: "bearer"

model:
  uri: "oci://quay.io/redhattraining/models/distilbert:2.25"
  name: "distilbert"
  connection:
    protocol: oci

resources:
  limits:
    cpu: "2"
    memory: 8Gi
    # Override merged base defaults so CPU predictive does not inherit nvidia.com/gpu: "1"
    nvidia.com/gpu: null
  requests:
    cpu: "1"
    memory: 1Gi
    nvidia.com/gpu: null

runtime:
  displayName: "OpenVINO Model Server"
  image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9:v3.3
  version: v2025.4
  modelFormat:
    name: onnx
    version: "1"

trustyai:
  enabled: true
