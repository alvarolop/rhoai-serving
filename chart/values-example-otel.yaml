# Example: Enable OpenTelemetry Tracing for NeMo Guardrails
#
# Usage:
#   helm template <release> chart/ \
#     -f chart/values.yaml \
#     -f chart/values-gpt-oss-20b.yaml \
#     -f chart/values-example-otel.yaml
#
# This enables OpenTelemetry tracing for observability.
# Traces are exported to the configured OTEL collector in your cluster.
#
# Prerequisites:
#   - OpenTelemetry Collector deployed in your cluster
#   - OTEL collector configured to receive traces on the standard gRPC port (4317)
#
# The NeMo Guardrails pod will automatically export traces using the
# OpenTelemetry environment variables (OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, etc.)
# injected into the pod.

guardrails:
  nemo:
    otel:
      enabled: true
      # Optional: Override OTEL collector endpoint
      # Default: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4317
      # endpoint: "http://my-otel-collector.monitoring.svc.cluster.local:4317"
