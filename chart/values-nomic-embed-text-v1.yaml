# Nomic Embed v1 — **GPU-only** Hugging Face embedding (8192 context); platform OpenShift AI vLLM worker.
# Model card: https://huggingface.co/nomic-ai/nomic-embed-text-v1
# vLLM pooling: https://docs.vllm.ai/en/latest/models/pooling_models/embed/
#
# `--trust-remote-code` is required for this Hub repo. Init may warn about chmod under `/mnt/models/.cache`;
# if download completes, that is harmless.
#
# Usage:
#   helm template nomic chart/ \
#     -f chart/values.yaml \
#     -f chart/values-nomic-embed-text-v1.yaml | oc apply -f -

name: nomic-embed-text-v1
namespace:
  name: model-nomic-embed

dashboard:
  genaiUseCase: embedding
  modelType: generative

model:
  uri: "hf://nomic-ai/nomic-embed-text-v1"
  name: "nomic-ai/nomic-embed-text-v1"
  connection:
    protocol: uri

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

# Tune if you OOM; Nomic weights are small vs BGE-M3 but keep a comfortable GPU memory headroom.
resources:
  limits:
    cpu: "6"
    memory: 16Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: "1"

extraArgs:
  - "--task"
  - "embedding"
  - "--trust-remote-code"
  - "--max-model-len"
  - "8192"

trustyai:
  enabled: false
