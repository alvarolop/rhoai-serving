# Nomic Embed v1 — **GPU-only** Hugging Face embedding; platform OpenShift AI vLLM worker.
# vLLM 0.13 (pooling / sentence-transformers path) derived `max_position_embeddings` **4096** here;
# `--max-model-len` must not exceed that unless you set `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1` in extraEnv
# (upstream warns about RoPE/position risks). Hub card may advertise 8192; this chart follows vLLM’s cap.
# Model card: https://huggingface.co/nomic-ai/nomic-embed-text-v1
# vLLM pooling: https://docs.vllm.ai/en/latest/models/pooling_models/embed/
#
# **Hub / offline:** `config.json` uses `auto_map` to load Python modules from a *second* repo
# (`nomic-ai/nomic-bert-2048`, see upstream `configuration_hf_nomic_bert` / `modeling_hf_nomic_bert`).
# Weights live under `/mnt/models`, but those modules are not in that tree. If the worker sets
# Hugging Face offline (or has no egress), startup fails with `LocalEntryNotFoundError` / “outgoing
# traffic has been disabled”. `extraEnv` below opts back into Hub when your cluster allows it.
# Strict air-gap: mirror/cache that dependency or use a model without cross-repo `auto_map` (e.g. BGE-M3).
#
# vLLM 0.13+ may log that `--trust-remote-code` is ignored for some paths; the Hub fetch above still applies.
# Init may warn about chmod under `/mnt/models/.cache`; if download completes, that is harmless.
#
# Usage:
#   helm template nomic chart/ \
#     -f chart/values.yaml \
#     -f chart/values-nomic-embed-text-v1.yaml | oc apply -f -

name: nomic-embed-text-v1
namespace:
  name: model-nomic-embed

dashboard:
  genaiUseCase: embedding
  modelType: generative

model:
  uri: "hf://nomic-ai/nomic-embed-text-v1"
  name: "nomic-ai/nomic-embed-text-v1"
  connection:
    protocol: uri

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

# Tune if you OOM; Nomic weights are small vs BGE-M3 but keep a comfortable GPU memory headroom.
resources:
  limits:
    cpu: "6"
    memory: 16Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: "1"

extraArgs:
  # - "--task"
  # - "embed"
  - "--trust-remote-code"
  - "--max-model-len"
  - "4096"

# Allow Transformers to resolve `auto_map` modules from hf.co when the image/platform defaults to offline.
# Remove or set to "1" only if you pre-populate HF cache (including `transformers_modules` for nomic-bert-2048).
extraEnv:
  - name: HF_HUB_OFFLINE
    value: "0"
  - name: TRANSFORMERS_OFFLINE
    value: "0"

trustyai:
  enabled: false
