# Gemma 4 26B-A4B instruction-tuned MoE, NVFP4 (compressed-tensors / llm-compressor).
# Hugging Face repo id (canonical): RedHatAI/gemma-4-26B-A4B-it-NVFP4
# (sometimes written gemma-4-26b.a4b-it-nvfp4 — same weights, different casing.)
#
# Usage:
#   helm template gemma4 chart/ -f chart/values.yaml -f chart/values-gemma-4-26b-a4b-it-nvfp4.yaml
#   ./deploy-mode.sh chart/values-gemma-4-26b-a4b-it-nvfp4.yaml
#
# Longer context: docs/007-nvfp4-inference-stack-and-gpu-matrix.md
# "A4B" in the model name: docs/008-gemma-4-a4b-moe-naming.md
#
# Compatibility (read before production):
# - vLLM: upstream merged Gemma4 quantized MoE loading in vllm-project/vllm#39045 (Apr 2026).
#   RedHatAI's model card originally recommended vLLM nightly for that fix. A stock "0.13" image
#   is only safe if your build includes that commit (or newer). Verify with your RHOAI vLLM
#   worker image / release notes; otherwise use a newer inference image or expect load failures.
# - GPU: NVFP4 paths are exercised heavily on Blackwell-class GPUs (e.g. B200 in upstream notes).
#   H100 (Hopper) may rely on emulation or alternate kernels — validate on-cluster; if unstable,
#   consider BF16/FP8 variants (e.g. google/gemma-4-26B-A4B-it or RedHatAI FP8 checkpoints) instead.
# - Context: --max-model-len 96000 matches upstream HF README but needs large VRAM; lower it if
#   you OOM on a single 80GB GPU.

name: gemma-4-26b-a4b-it-nvfp4
namespace:
  name: model-gemma4-nvfp4

model:
  uri: "hf://RedHatAI/gemma-4-26B-A4B-it-NVFP4"
  name: "RedHatAI/gemma-4-26B-A4B-it-NVFP4"
  connection:
    protocol: uri

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

# Use official upstream vLLM image with Gemma 4 MoE support
# vLLM v0.20.0 includes the fix from vllm-project/vllm#39045 (Apr 2026)
# RHOAI vLLM 0.13 may not have this fix yet
mainContainer:
  image: vllm/vllm-openai:v0.20.0
  # Passed as VLLM_ADDITIONAL_ARGS to KServe wrapper script
  extraArgs:
    - "--max-model-len"
    - "8192"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--max-num-batched-tokens"
    - "4096"
    - "--disable-uvicorn-access-log"  # Reduce log verbosity (KServe router already logs requests)

resources:
  limits:
    cpu: "8"
    memory: 64Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 16Gi
    nvidia.com/gpu: "1"

# Optional when your vLLM build supports Gemma 4 OpenAI tool/reasoning parsers (see recipes.vllm.ai):
# extraArgs:
#   - "--max-model-len"
#   - "32768"
#   - "--gpu-memory-utilization"
#   - "0.92"
#   - "--enable-auto-tool-choice"
#   - "--tool-call-parser"
#   - "gemma4"
#   - "--reasoning-parser"
#   - "gemma4"
