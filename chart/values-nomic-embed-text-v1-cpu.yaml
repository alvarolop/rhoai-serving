# Nomic Embed v1 — **CPU** embeddings using official Red Hat vLLM CPU runtime
#
# ✅ Nomic BERT is supported in vLLM v0.13.0+ via NomicBertModelC architecture
# See: https://docs.vllm.ai/en/v0.13.0/models/supported_models/#embedding
#
# Model card: https://huggingface.co/nomic-ai/nomic-embed-text-v1
# vLLM pooling: https://docs.vllm.ai/en/latest/models/pooling_models/embed/
#
# **Hub / offline:** auto_map requires nomic-ai/nomic-bert-2048 modules.
# extraEnv below allows Hub access when cluster permits egress.
#
# **Image:** Uses registry.redhat.io/rhaiis/vllm-cpu-rhel9:3.3 (vLLM 0.13.0+rhai11)
# Note: rhaiis = Red Hat AI Inference Services
#
# Usage:
#   helm template nomic-cpu chart/ \
#     -f chart/values.yaml \
#     -f chart/values-nomic-embed-text-v1-cpu.yaml | oc apply -f -

name: nomic-embed-text-v1-cpu
namespace:
  create: false
  name: models-as-a-service

model:
  uri: hf://nomic-ai/nomic-embed-text-v1
  name: nomic-ai/nomic-embed-text-v1
  metadata:
    useCase: embedding
    type: generative
serving:
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications
# # For Model-as-a-Service (MaaS) routing, uncomment and configure:
#   routerGatewayRefs:
#     - name: maas-default-gateway
#       namespace: openshift-ingress

# Red Hat AI Inference Server vLLM CPU image (amd64, AVX2). This repo has no "latest" tag: pin an explicit version (3.3 is the newest)
# vLLM 0.13.0+ supports NomicBertModelC architecture
mainContainer:
  image: registry.redhat.io/rhaiis/vllm-cpu-rhel9:3.3
  extraArgs:
    - "--trust-remote-code"
    - "--max-model-len"
    - "4096"
  # Allow Transformers to resolve auto_map modules from HF Hub
  # (Nomic requires nomic-ai/nomic-bert-2048 modules)
  env:
    - name: HF_HUB_OFFLINE
      value: "0"
    - name: TRANSFORMERS_OFFLINE
      value: "0"

# CPU resources for embedding inference
  resources:
    limits:
      cpu: "8"
      memory: "16Gi"
    requests:
      cpu: "4"
      memory: "8Gi"
