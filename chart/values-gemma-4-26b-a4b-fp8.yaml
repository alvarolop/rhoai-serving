# Gemma 4 31B instruction-tuned, FP8-Dynamic quantization (compressed-tensors)
# Hugging Face repo id: RedHatAI/gemma-4-31B-it-FP8-Dynamic
#
# Usage:
#   helm template gemma4-fp8 chart/ -f chart/values.yaml -f chart/values-gemma-4-31b-it-fp8-dynamic.yaml
#   ./deploy-model.sh chart/values-gemma-4-31b-it-fp8-dynamic.yaml
#
# FP8-Dynamic vs NVFP4:
# - FP8-Dynamic: Scaling factors recalculated dynamically during inference
#   - Better quality (less degradation vs original model)
#   - Native support on H100 (Hopper) Tensor Cores
#   - Recommended for H100 with NVLink
# - NVFP4: Designed for Blackwell (B200/GB200), uses emulation on H100
#
# Model details:
# - 31B parameters (actual ~33B with MoE experts)
# - FP8 quantization with dynamic scaling
# - Optimized for NVIDIA H100 GPUs (native FP8 support)
# - Larger context window support vs NVFP4 (H100 has more VRAM)
#
# Compatibility:
# - vLLM: Requires v0.13.0+ for Gemma 4 architecture support
# - GPU: Optimized for H100 (80GB VRAM), can run on A100 with reduced context
# - Context: --max-model-len up to 32768 recommended for H100

name: gemma-4-26b-a4b-fp8
namespace:
  create: false
  name: models-as-a-service

model:
  uri: oci://quay.io/alopezme/modelcar-gemma-4-26b-a4b-fp8:latest
  name: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
  metadata:
    useCase: chat
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications
  # For Model-as-a-Service (MaaS) routing
  # When defined, NeMo Guardrails automatically uses internal gateway URL
  # Comment out to use direct workload service instead
  routerGatewayRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress

# Use OpenShift AI default vLLM image (supports FP8 natively)
# Or specify a version if needed: vllm/vllm-openai:v0.13.0+
mainContainer:
  # image: ""  # Uses default OpenShift AI vLLM image
  # Passed as VLLM_ADDITIONAL_ARGS to KServe wrapper script
  # Configuration tuned for H100 80GB to avoid OOM during CUDA graph capture
  extraArgs:
    # - "--disable-uvicorn-access-log"
    - "--chat-template"
    - "/vllm-workspace/examples/tool_chat_template_gemma4.jinja"
    - "--limit-mm-per-prompt"
    - "'{\"image\": 0, \"audio\": 0}'"

    # - "--max-model-len"
    # - "16384"  # Conservative for H100 80GB; increase to 32768 if VRAM allows
    # - "--gpu-memory-utilization"
    # - "0.85"  # Reduced from 0.90 to leave headroom for CUDA graphs
    # - "--max-num-batched-tokens"
    # - "8192"
    # - "--max-num-seqs"
    # - "256"  # Limit concurrent sequences to reduce CUDA graph memory
    # - "--disable-log-stats"  # Reduce logging overhead

  resources:
    limits:
      cpu: "8"
      memory: "64Gi"
      nvidia.com/gpu: "1"  # Single H100 recommended
    requests:
      cpu: "2"
      memory: "16Gi"
      nvidia.com/gpu: "1"
