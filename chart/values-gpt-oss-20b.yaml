# GPT-OSS 20B - OCI-based generative model (ModelCar from registry.redhat.io)
# Usage: helm template chart/ --generate-name -f chart/values.yaml -f chart/values-gpt-oss-20b.yaml
#
# No imagePullSecrets needed: registry.redhat.io is covered by the OpenShift global pull secret.

name: gpt-oss-20b
namespace:
  name: model-gpt-oss

model:
  uri: "oci://registry.redhat.io/rhelai1/modelcar-gpt-oss-20b:1.5"
  name: "gpt-oss-20b"
  connection:
    protocol: oci

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

mainContainer:
  extraArgs:
    - "--disable-uvicorn-access-log"

resources:
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "1"
    memory: 12Gi
    nvidia.com/gpu: "1"
