# GPT-OSS 20B - OCI-based generative model (ModelCar from registry.redhat.io)
# Usage: helm template chart/ --generate-name -f chart/values.yaml -f chart/values-gpt-oss-20b.yaml
#
# No imagePullSecrets needed: registry.redhat.io is covered by the OpenShift global pull secret.

name: gpt-oss-20b
namespace:
  name: model-gpt-oss

model:
  uri: "oci://registry.redhat.io/rhelai1/modelcar-gpt-oss-20b:1.5"
  name: "gpt-oss-20b"
  connection:
    protocol: oci

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

scaling:
  mode: fixed
  replicas: 1

mainContainer:
  extraArgs:
    - "--disable-uvicorn-access-log"
  # Health probes tuned for large model loading (~3min)
  startupProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30  # 30 × 10s = 5min max startup time
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    periodSeconds: 30
    failureThreshold: 2  # 2 × 30s = 60s to recover
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

resources:
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "1"
    memory: 12Gi
    nvidia.com/gpu: "1"
