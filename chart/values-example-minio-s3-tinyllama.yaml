# Example: generative model weights on in-cluster MinIO (rhoai-gitops components/minio).
# 1) Upload weights: packaging-s3/upload-model-to-minio.sh --bucket rhoai-demo-models --prefix tinyllama-1.1b --hf-repo TinyLlama/TinyLlama-1.1B-Chat-v1.0
# 2) Deploy: helm template tinyllama chart/ -f chart/values.yaml -f chart/values-example-minio-s3-tinyllama.yaml
#
# Replace credentials with your MinIO root (or dedicated S3 user) — defaults match unmodified gitops MinIO chart.

name: tinyllama-s3-minio
namespace:
  create: false
  name: models-as-a-service

model:
  # KServe / initializer typically resolve s3://… into the pod (often under /mnt/models); keep in sync with .connection.s3.
  uri: s3://rhoai-demo-models/tinyllama-1.1b
  name: tinyllama-s3-minio
  metadata:
    useCase: chat
    type: generative
  s3:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
    bucket: "rhoai-demo-models"
    accessKeyId: "minio"
    secretAccessKey: "minio123"
    region: "us-east-1"
    path: "tinyllama-1.1b"
serving:
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications
# # For Model-as-a-Service (MaaS) routing, uncomment and configure:
#   routerGatewayRefs:
#     - name: maas-default-gateway
#       namespace: openshift-ingress

mainContainer:
  image: "docker.io/vllm/vllm-openai-cpu:v0.22.0"
  extraArgs:
    - "--enforce-eager"
    - "--kv-cache-memory-bytes"
    - "10737418240" # 10GB (leaving 6GB for model + runtime in 16GB limit)
  resources:
    limits:
      cpu: "8"
      memory: "16Gi"
    requests:
      cpu: "2"
      memory: "16Gi"
  # Health probes tuned for CPU backend warmup (~40s)
  startupProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    initialDelaySeconds: 45
    periodSeconds: 10
    failureThreshold: 12  # 45s + (12 × 10s) = 165s max startup time
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    periodSeconds: 30
    failureThreshold: 2  # 2 × 30s = 60s to recover
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
      scheme: HTTPS
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
