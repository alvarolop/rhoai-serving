# Qwen3-8B FP8 - Single GPU generative model
# Usage: helm template qwen chart/ -f chart/values.yaml -f chart/values-qwen3-8b-fp8-dynamic.yaml

name: qwen3-8b
namespace:
  create: false
  name: models-as-a-service

model:
  uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
  name: RedHatAI/Qwen3-8B-FP8-dynamic
  metadata:
    useCase: chat
    type: generative
serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

scaling:
  mode: fixed
  replicas: 1

mainContainer:
  # extraArgs:
  #   - --disable-uvicorn-access-log

  resources:
    limits:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "1"
      memory: "8Gi"
      nvidia.com/gpu: "1"

# GPU through DRA: shared ResourceClaimTemplate defined by the platform (rhoai-gitops, templates/06-dra), not created by this chart.
# Sizes: gpu-s-x1 = small (embeddings; MIG 1g.12gb or any GPU >= 16Gi), gpu-m-x1 = L4-class 24 GB (8-24B models on the L4), gpu-l-x1 = 1x H100 (>= 80Gi).
# Ignored with dra.enabled=false (device plugin). Remove the line to let the chart create its own template.
dra:
  claimTemplate:
    existing: gpu-m-x1
