# Qwen3-8B FP8 - Single GPU generative model
# Usage: helm template qwen chart/ -f chart/values.yaml -f chart/values-qwen3-8b-fp8-dynamic.yaml

name: qwen3-8b
namespace:
  name: models-as-a-service

model:
  uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
  name: RedHatAI/Qwen3-8B-FP8-dynamic
  metadata:
    useCase: chat
    type: generative
serving:
  dra:
    claimTemplate: gpu-m-x1  # platform GPU size (rhoai-gitops 06-dra): gpu-s-x1 embeddings, gpu-m-x1 L4, gpu-l-x1 H100, gpu-xl-x1 1 GPU 140 Gi+
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

scaling:
  mode: fixed
  replicas: 1

mainContainer:
  # extraArgs:
  #   - --disable-uvicorn-access-log

  resources:
    limits:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "1"
      memory: "8Gi"
      nvidia.com/gpu: "1"
