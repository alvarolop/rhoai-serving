# Qwen3-8B FP8 - Single GPU generative model
# Usage: helm template qwen chart/ -f chart/values.yaml -f chart/values-qwen3-8b-fp8-dynamic.yaml

name: qwen3-8b
namespace:
  name: model-qwen

model:
  uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
  name: RedHatAI/Qwen3-8B-FP8-dynamic
  connection:
    protocol: oci

serving:
  hardwareProfile:
    name: gpu-profile
    namespace: redhat-ods-applications

scaling:
  mode: fixed
  replicas: 1

mainContainer:
  extraArgs:
    - --disable-uvicorn-access-log

resources:
  limits:
    cpu: 4
    memory: 32Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 1
    memory: 8Gi
    nvidia.com/gpu: 1

# For Model-as-a-Service (MaaS) routing, uncomment and configure:
# routerGatewayRefs:
#   - name: maas-default-gateway
#     namespace: openshift-ingress
