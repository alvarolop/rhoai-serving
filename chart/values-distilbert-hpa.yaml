# DistilBERT - Predictive model with HPA autoscaling enabled
# Usage: helm template distilbert chart/ -f chart/values.yaml -f chart/values-distilbert-hpa.yaml | oc apply -f -

name: distilbert
namespace:
  name: model-distilbert

serving:
  type: predictive
  hardwareProfile:
    name: cpu-profile
    namespace: redhat-ods-applications

# HPA autoscaling enabled - scales based on CPU from 1 to 5 replicas
scaling:
  mode: hpa
  hpa:
    minReplicas: 1
    maxReplicas: 5
    scaleMetric: cpu
    scaleTarget: 80  # Target 80% CPU utilization

model:
  uri: "oci://quay.io/redhattraining/models/distilbert:2.25"
  name: "distilbert"
  connection:
    protocol: oci

resources:
  limits:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: null
  requests:
    cpu: "1"
    memory: 1Gi
    nvidia.com/gpu: null

runtime:
  displayName: "OpenVINO Model Server"
  image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9:v3.3
  version: v2025.4
  modelFormat:
    name: onnx
    version: "1"

trustyai:
  enabled: false
